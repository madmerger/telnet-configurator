# Local lab: SSH with password and public key auth, served by `make lab-docker-start`
# (lab/docker). Auth is chosen per device: password for AX-4000 R5 and BG-7,
# public key for AX-4000 R6. Secrets come from the environment:
#   CBT_PASSWORD=cbt-pass CBT_ENABLE_PASSWORD=cbt-enable bin/cbt-collect -i conf/devices.local-docker.conf
# (`make collect-docker` sets these lab values.)
[TKY-ENB-0001]
host = 127.0.0.1
port = 2401
protocol = ssh
auth = password
user = cbtadmin
password = ${CBT_PASSWORD}
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
model = AX-4000
sw = R5.2.1
enable_password = ${CBT_ENABLE_PASSWORD}

[OSK-ENB-0102]
host = 127.0.0.1
port = 2402
protocol = ssh
auth = key
user = cbtadmin
key_file = lab/.state/cbt_id_ed25519
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
model = AX-4000
sw = R6.1.0
enable_password = ${CBT_ENABLE_PASSWORD}

[NGY-GNB-0203]
host = 127.0.0.1
port = 2403
protocol = ssh
auth = password
user = cbtadmin
password = ${CBT_PASSWORD}
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
model = BG-7
sw = V200R003C10
