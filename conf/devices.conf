# Production inventory (example). Devices are reachable only from the CBT server.
# Per device:  protocol = telnet | ssh   (default telnet)
#              auth = password | key      (ssh only, default password)
#              key_file = ${CBT_SSH_KEY}  (auth = key)
# Secrets are referenced as ${NAME} and taken from the environment.
[TKY-ENB-0001]
host = 10.10.1.21
model = AX-4000
sw = R5.2.1
user = cbtadmin
password = ${CBT_PASSWORD}
enable_password = ${CBT_ENABLE_PASSWORD}

[OSK-ENB-0102]
host = 10.10.2.37
model = AX-4000
sw = R6.1.0
user = cbtadmin
password = ${CBT_PASSWORD}
enable_password = ${CBT_ENABLE_PASSWORD}

[NGY-GNB-0203]
host = 10.10.3.54
model = BG-7
sw = V200R003C10
user = cbtadmin
password = ${CBT_PASSWORD}

