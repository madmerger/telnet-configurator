# Production inventory (example). Devices are reachable only from the CBT server.
# protocol = ssh | telnet per device while the migration is in progress (default: telnet).
# Secrets are never written here: ${NAME} references the environment, and when password,
# enable_password or key_file is omitted, CBT_PASSWORD, CBT_ENABLE_PASSWORD and
# CBT_SSH_KEY_FILE are used. Host keys are checked strictly (host_key_check = yes).
[TKY-ENB-0001]
protocol = ssh
auth = publickey
host = 10.10.1.21
model = AX-4000
sw = R5.2.1
user = cbtadmin
key_file = ${CBT_SSH_KEY_FILE}
known_hosts = ${CBT_SSH_KNOWN_HOSTS}
enable_password = ${CBT_ENABLE_PASSWORD}

[OSK-ENB-0102]
protocol = ssh
auth = password
host = 10.10.2.37
model = AX-4000
sw = R6.1.0
user = cbtadmin
password = ${CBT_PASSWORD}
known_hosts = ${CBT_SSH_KNOWN_HOSTS}
enable_password = ${CBT_ENABLE_PASSWORD}

[NGY-GNB-0203]
# not migrated yet
protocol = telnet
host = 10.10.3.54
model = BG-7
sw = V200R003C10
user = cbtadmin
password = ${CBT_PASSWORD}
