# Local lab: SSH with public key auth, served by `make lab-ssh-start` (lab/ssh).
# Same devices as devices.local.conf (Telnet). The login user is you: ${USER}.
# sshd authenticates the key; the enable password is still asked by the device CLI.
# Unknown lab host keys are recorded in lab/.state/known_hosts on first use (accept-new).
[TKY-ENB-0001]
host = 127.0.0.1
port = 2201
protocol = ssh
auth = key
user = ${USER}
key_file = lab/.state/cbt_id_ed25519
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
model = AX-4000
sw = R5.2.1
enable_password = cbt-enable

[OSK-ENB-0102]
host = 127.0.0.1
port = 2202
protocol = ssh
auth = key
user = ${USER}
key_file = lab/.state/cbt_id_ed25519
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
model = AX-4000
sw = R6.1.0
enable_password = cbt-enable

[NGY-GNB-0203]
host = 127.0.0.1
port = 2203
protocol = ssh
auth = key
user = ${USER}
key_file = lab/.state/cbt_id_ed25519
known_hosts = lab/.state/known_hosts
host_key_check = accept-new
