# Local lab: lab/ssh (`make lab-ssh-start`), public key auth, login user is you.
# Key and known_hosts come from the environment (see `make collect-ssh`):
#   CBT_SSH_KEY_FILE=lab/.state/cbt_id_ed25519  CBT_SSH_KNOWN_HOSTS=lab/.state/known_hosts
[TKY-ENB-0001]
protocol = ssh
auth = publickey
host = 127.0.0.1
port = 2201
host_key_check = accept-new
model = AX-4000
sw = R5.2.1
user = ${USER}
enable_password = cbt-enable

