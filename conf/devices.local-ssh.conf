# Local SSH labs (127.0.0.1 only). Secrets are not written here; they come from the environment:
#   export CBT_PASSWORD=cbt-pass CBT_ENABLE_PASSWORD=cbt-enable
#   export CBT_SSH_KEY=$PWD/lab/.state/cbt_id_ed25519
# `make collect-ssh` sets these lab defaults for you.
#   export CBT_LAB_KNOWN_HOSTS=$PWD/lab/.state/known_hosts
# Host keys are checked (default host_key_check = yes): lab/keys.sh creates the labs' host keys
# and registers them in lab/.state/known_hosts.

# --- lab/ssh (make lab-ssh-start): public key auth, login user is you ($USER) ---
[TKY-ENB-0001-key]
host = 127.0.0.1
port = 2201
protocol = ssh
auth = key
key_file = ${CBT_SSH_KEY}
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = AX-4000
sw = R5.2.1
user = ${USER}
enable_password = ${CBT_ENABLE_PASSWORD}

[OSK-ENB-0102-key]
host = 127.0.0.1
port = 2202
protocol = ssh
auth = key
key_file = ${CBT_SSH_KEY}
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = AX-4000
sw = R6.1.0
user = ${USER}
enable_password = ${CBT_ENABLE_PASSWORD}

[NGY-GNB-0203-key]
host = 127.0.0.1
port = 2203
protocol = ssh
auth = key
key_file = ${CBT_SSH_KEY}
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = BG-7
sw = V200R003C10
user = ${USER}

# --- lab/docker (make lab-docker-start): password auth (the lab also accepts the key) ---
[TKY-ENB-0001-pw]
host = 127.0.0.1
port = 2401
protocol = ssh
auth = password
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = AX-4000
sw = R5.2.1
user = cbtadmin
password = ${CBT_PASSWORD}
enable_password = ${CBT_ENABLE_PASSWORD}

[OSK-ENB-0102-pw]
host = 127.0.0.1
port = 2402
protocol = ssh
auth = password
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = AX-4000
sw = R6.1.0
user = cbtadmin
password = ${CBT_PASSWORD}
enable_password = ${CBT_ENABLE_PASSWORD}

[NGY-GNB-0203-pw]
host = 127.0.0.1
port = 2403
protocol = ssh
auth = password
known_hosts = ${CBT_LAB_KNOWN_HOSTS}
model = BG-7
sw = V200R003C10
user = cbtadmin
password = ${CBT_PASSWORD}
